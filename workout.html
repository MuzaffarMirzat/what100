<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#143028" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="what100 Workout" />
  <meta name="description" content="60-day workout tracker — what100" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <title>Workout — what100</title>
  <style>
    :root {
      --bg: #143028;
      --surface: rgba(255, 248, 240, 0.08);
      --surface2: rgba(255, 248, 240, 0.14);
      --text: #fff8f0;
      --muted: #b7d4c4;
      --accent: #ffd166;
      --accent-2: #06d6a0;
      --accent-dim: #f4a261;
      --warn: #ffb703;
      --danger: #ff6b6b;
      --work: #ff6b6b;
      --rest: #4cc9f0;
      --radius: 18px;
      --tap: 48px;
      --font: "Nunito", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 18px; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      padding-top: var(--safe-t);
      padding-bottom: calc(72px + var(--safe-b));
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(255, 209, 102, 0.28), transparent 52%),
        radial-gradient(90% 70% at 100% 8%, rgba(6, 214, 160, 0.22), transparent 48%),
        radial-gradient(80% 60% at 50% 100%, rgba(255, 122, 89, 0.16), transparent 55%),
        linear-gradient(165deg, #143028 0%, #1a3d32 48%, #0f2420 100%);
      background-attachment: fixed;
    }
    a { color: var(--accent); text-decoration: none; font-weight: 700; }
    a:active { opacity: 0.85; }
    .top-nav {
      padding: 12px 16px;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(20, 48, 40, 0.75);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    #app {
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      animation: rise 320ms ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1, h2, h3 { margin: 0 0 0.5rem; font-weight: 700; line-height: 1.25; }
    h1 {
      font-family: var(--display);
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }
    h2 { font-size: 1.15rem; margin-top: 1.25rem; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .hint { color: var(--muted); font-size: 0.85rem; margin: 4px 0 10px; }
    .card {
      background: linear-gradient(160deg, rgba(255,248,240,0.12), rgba(255,248,240,0.05));
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 248, 240, 0.12);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .progress-bar-wrap {
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0 18px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-2), var(--accent), #ff8fab);
      border-radius: 999px;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.45);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      background: var(--surface2);
      color: var(--text);
      touch-action: manipulation;
      transition: transform 140ms ease, filter 140ms ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ff9f1c);
      color: #2b1a08;
      width: 100%;
      box-shadow: 0 8px 24px rgba(255, 209, 102, 0.35);
    }
    .btn-primary:active { filter: brightness(0.95); }
    .btn-ghost {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.18);
    }
    .btn-sm { min-height: 40px; padding: 8px 14px; font-size: 0.9rem; }
    .btn-huge {
      min-height: 72px;
      font-size: 1.3rem;
      width: 100%;
      margin: 8px 0;
    }
    .start-hero {
      text-align: center;
      padding: 40px 12px 28px;
    }
    .start-hero h1 {
      font-size: 2rem;
      background: linear-gradient(120deg, #fff8f0, var(--accent), #ff8fab);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .start-blob {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      border-radius: 40% 60% 55% 45% / 45% 40% 60% 55%;
      background:
        radial-gradient(circle at 30% 30%, #fff, transparent 40%),
        linear-gradient(135deg, var(--accent), var(--accent-2));
      animation: blob 4s ease-in-out infinite;
      box-shadow: 0 16px 40px rgba(255, 209, 102, 0.35);
    }
    @keyframes blob {
      0%, 100% { border-radius: 40% 60% 55% 45% / 45% 40% 60% 55%; transform: rotate(0deg); }
      50% { border-radius: 55% 45% 40% 60% / 50% 55% 45% 50%; transform: rotate(6deg); }
    }
    .start-hero p { color: var(--muted); max-width: 320px; margin: 12px auto 24px; }
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .check-row:last-child { border-bottom: none; }
    .check-btn {
      flex-shrink: 0;
      width: var(--tap);
      height: var(--tap);
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: transparent;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }
    .check-btn.done {
      background: linear-gradient(135deg, var(--accent-2), #80ed99);
      border-color: transparent;
      color: #0d3b2e;
      transform: scale(1.05);
      animation: checkPop 280ms ease;
    }
    @keyframes checkPop {
      0% { transform: scale(0.85); }
      60% { transform: scale(1.12); }
      100% { transform: scale(1.05); }
    }
    .ex-body { flex: 1; min-width: 0; }
    .ex-title { font-weight: 800; }
    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .stepper button {
      width: var(--tap);
      height: var(--tap);
      border-radius: 16px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .stepper .val {
      min-width: 56px;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .set-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      flex-wrap: wrap;
    }
    .set-check {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background: transparent;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .set-check.done {
      background: linear-gradient(135deg, var(--accent-2), #80ed99);
      border-color: transparent;
      color: #0d3b2e;
    }
    .habits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .habit-chip {
      min-height: var(--tap);
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      text-align: left;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
      transition: transform 140ms ease, background 140ms ease;
    }
    .habit-chip.on {
      border-color: transparent;
      background: linear-gradient(135deg, rgba(6, 214, 160, 0.35), rgba(255, 209, 102, 0.25));
      transform: scale(1.02);
    }
    .banner {
      background: linear-gradient(135deg, rgba(255, 183, 3, 0.22), rgba(255, 143, 171, 0.15));
      border: 1px solid rgba(255, 209, 102, 0.45);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .banner-actions { display: flex; gap: 8px; margin-top: 10px; }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: rgba(20, 48, 40, 0.94);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: var(--safe-b);
      z-index: 100;
    }
    .tab-bar button {
      flex: 1;
      min-height: 60px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 4px;
      transition: color 160ms ease, transform 160ms ease;
    }
    .tab-bar button.active {
      color: var(--accent);
      transform: translateY(-2px);
    }
    .timer-display {
      font-family: var(--display);
      font-size: 4.2rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
      margin: 24px 0;
    }
    .timer-display.work { color: var(--work); }
    .timer-display.rest { color: var(--rest); }
    .timer-round { text-align: center; font-size: 1.2rem; color: var(--muted); font-weight: 700; }
    .timer-panel { text-align: center; }
    .grid-60 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin: 12px 0;
    }
    .grid-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      font-size: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-weight: 700;
    }
    .grid-cell.done {
      background: linear-gradient(135deg, var(--accent-2), #80ed99);
      color: #0d3b2e;
    }
    .grid-cell.missed {
      background: rgba(255, 107, 107, 0.45);
      color: #fff;
      opacity: 0.85;
    }
    .grid-cell.today {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .chart-svg { width: 100%; height: 120px; display: block; }
    textarea, input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      min-height: var(--tap);
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.22);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }
    label { display: block; margin: 8px 0 4px; font-size: 0.9rem; color: var(--muted); font-weight: 700; }
    .celebrate {
      text-align: center;
      padding: 28px 18px;
      position: relative;
      overflow: hidden;
      animation: pop 0.45s ease;
      background: linear-gradient(160deg, rgba(255, 209, 102, 0.25), rgba(6, 214, 160, 0.18));
      border-color: rgba(255, 209, 102, 0.4);
    }
    .celebrate h2 {
      font-family: var(--display);
      font-size: 1.8rem;
      margin-top: 0;
    }
    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 20%, #ffd166 0 4px, transparent 5px),
        radial-gradient(circle at 82% 18%, #06d6a0 0 5px, transparent 6px),
        radial-gradient(circle at 30% 78%, #ff8fab 0 4px, transparent 5px),
        radial-gradient(circle at 70% 70%, #4cc9f0 0 5px, transparent 6px),
        radial-gradient(circle at 50% 30%, #fff 0 3px, transparent 4px);
      animation: confettiFall 1.2s ease-out;
    }
    @keyframes confettiFall {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .pick-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      margin: 4px 8px 4px 0;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
    }
    .pick-toggle.on {
      border-color: transparent;
      background: linear-gradient(135deg, rgba(6, 214, 160, 0.35), rgba(255, 209, 102, 0.28));
    }
    .level-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .level-btns button {
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .level-btns button.on {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), #ff9f1c);
      color: #2b1a08;
    }
    .rules-list { margin: 0; padding-left: 1.2rem; }
    .rules-list li { margin-bottom: 8px; }
    .hidden { display: none !important; }
    select {
      min-height: var(--tap);
      padding: 10px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 1rem;
      font-family: inherit;
      width: 100%;
    }
    .phase-chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.2);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <nav class="top-nav"><a href="./index.html">← Goals</a> <span class="muted" style="float:right;font-size:0.75rem">updated Oct 4</span></nav>
  <div id="app"></div>
  <nav class="tab-bar" id="tab-bar" aria-label="Main"></nav>
  <input type="file" id="import-file" accept="application/json" class="hidden" aria-hidden="true" />
  <script>
(function () {
  "use strict";

  const STORAGE_KEY = "what100.workout.v1";
  const CHECKIN_DAYS = [1, 15, 30, 45, 60];
  const PUSH_LEVELS = ["wall", "knees", "standard", "feet raised"];
  const WED_POOL = [
    { id: "goblet_squat", label: "Goblet squats" },
    { id: "pushups", label: "Push-ups" },
    { id: "db_row", label: "DB rows" },
    { id: "ohp", label: "Overhead press" },
    { id: "lunges", label: "Lunges" },
    { id: "chest_press", label: "Chest press" },
    { id: "step_ups", label: "Step-ups" },
  ];
  const WEIGHTED = {
    goblet_squat: { inc: 10, kind: "lower" },
    db_row: { inc: 5, kind: "upper" },
    kb_farmer: { inc: 10, kind: "lower" },
    lunges: { inc: 10, kind: "lower" },
    ohp: { inc: 5, kind: "upper" },
    chest_press: { inc: 5, kind: "upper" },
    step_ups: { inc: 10, kind: "lower" },
  };

  let timerState = {
    running: false,
    mode: null,
    phase: "idle",
    remaining: 0,
    round: 1,
    totalRounds: 1,
    workSec: 20,
    restSec: 40,
    holdTarget: 20,
    intervalId: null,
    countdownId: null,
    wakeLock: null,
  };

  let audioCtx = null;

  function defaultState() {
    return {
      startDate: null,
      unit: "lb",
      sound: true,
      tab: "today",
      exerciseMeta: {},
      progressionOffers: {},
      wedDefaultPicks: ["goblet_squat", "pushups", "db_row", "ohp", "lunges"],
      days: {},
      checkIns: {},
      bodyWeightLog: [],
      exerciseWeightLog: {},
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return { ...defaultState(), ...JSON.parse(raw) };
    } catch {
      return defaultState();
    }
  }

  let state = loadState();

  // Force Day 1 to tomorrow (2026-10-05) if they opened/started early.
  (function applyTomorrowStart() {
    const FLAG = "what100.workout.startTomorrow.v1";
    if (localStorage.getItem(FLAG) === "1") return;
    const tomorrow = "2026-10-05";
    if (state.startDate && state.startDate <= "2026-10-04") {
      state.startDate = tomorrow;
      state.viewDay = null;
      save();
    }
    localStorage.setItem(FLAG, "1");
  })();

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function localYMD(d) {
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function parseYMD(s) {
    const p = s.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function addDays(ymd, n) {
    const d = parseYMD(ymd);
    d.setDate(d.getDate() + n);
    return localYMD(d);
  }

  function daysDiff(fromYmd, toYmd) {
    const a = parseYMD(fromYmd);
    const b = parseYMD(toYmd);
    return Math.round((b - a) / 86400000);
  }

  function programDayFor(ymd) {
    if (!state.startDate) return null;
    const d = daysDiff(state.startDate, ymd);
    if (d < 0) return null;
    if (d >= 60) return 60;
    return d + 1;
  }

  function dateForProgramDay(n) {
    return addDays(state.startDate, n - 1);
  }

  function getPhase(pd) {
    if (pd <= 14) return { key: "foundation", name: "Foundation", sets: 3, repMin: 10, repMax: 12, sprintRounds: 6, sprintRest: 40, hiitRounds: 2, hiitHard: 240, hiitEasy: 180, weeklyCardio: 90, plankTarget: 20 };
    if (pd <= 28) return { key: "build", name: "Build", sets: 3, repMin: 12, repMax: 12, sprintRounds: 8, sprintRest: 30, hiitRounds: 3, hiitHard: 240, hiitEasy: 180, weeklyCardio: 120, plankTarget: 30 };
    if (pd <= 42) return { key: "push", name: "Push", sets: 4, repMin: 8, repMax: 10, sprintRounds: 8, sprintRest: 20, hiitRounds: 4, hiitHard: 240, hiitEasy: 180, weeklyCardio: 150, plankTarget: 40 };
    if (pd <= 56) return { key: "peak", name: "Peak", sets: 4, repMin: 8, repMax: 10, sprintRounds: 10, sprintRest: 20, hiitRounds: 4, hiitHard: 240, hiitEasy: 180, weeklyCardio: 165, plankTarget: 50, finisher: true };
    return { key: "finish", name: "Finish", sets: 2, repMin: 8, repMax: 10, sprintRounds: 0, sprintRest: 40, hiitRounds: 0, hiitHard: 240, hiitEasy: 180, weeklyCardio: 90, plankTarget: 60, light: true };
  }

  function weekdayMon0(ymd) {
    const d = parseYMD(ymd).getDay();
    return d === 0 ? 6 : d - 1;
  }

  function ensureMeta(exId) {
    if (!state.exerciseMeta[exId]) {
      state.exerciseMeta[exId] = {
        weight: 25,
        pushLevel: 0,
        lastSets: [],
        lastDate: null,
      };
    }
    return state.exerciseMeta[exId];
  }

  function displayWeight(lb) {
    if (state.unit === "kg") return Math.round(lb * 0.453592 * 10) / 10;
    return lb;
  }

  function unitLabel() {
    return state.unit === "kg" ? "kg" : "lb";
  }

  function ensureDay(ymd) {
    if (!state.days[ymd]) {
      state.days[ymd] = {
        completed: false,
        skipped: false,
        miniWorkout: false,
        habits: { steps: false, protein: false, sleep: false, water: false },
        items: {},
        playNote: "",
        wedPicks: state.wedDefaultPicks.slice(),
        easyCardioMin: 0,
        celebrationShown: false,
      };
    }
    return state.days[ymd];
  }

  function getItem(day, itemId) {
    const d = ensureDay(day);
    if (!d.items[itemId]) {
      d.items[itemId] = { checked: false, sets: [], minutes: 0, level: null };
    }
    return d.items[itemId];
  }

  function weightStep(exId) {
    const cfg = WEIGHTED[exId];
    return cfg && cfg.kind === "lower" ? 10 : 5;
  }

  function initWeightedSets(day, exId, phase, storageId) {
    const sid = storageId || exId;
    const item = getItem(day, sid);
    const meta = ensureMeta(exId);
    if (item.sets.length === 0) {
      const n = phase.sets;
      const defReps = phase.repMax;
      for (let i = 0; i < n; i++) {
        const prev = meta.lastSets[i];
        item.sets.push({
          weight: meta.weight,
          reps: prev != null ? prev : defReps,
          done: false,
        });

      const defReps = phase.repMax;
      for (let i = 0; i < n; i++) {

        item.sets.push({ reps: prev != null ? prev : defReps, done: false });
      }
    }
    return item;
  }

  function maybeOfferProgression(exId) {
    const m = ensureMeta(exId);
    const cfg = WEIGHTED[exId];
    if (!cfg || !m.lastSets.length) return;
    const phase = getPhase(programDayFor(m.lastDate) || 1);
    const top = phase.repMax;
    if (m.lastSets.every((r) => r >= top)) {
      const offer = m.weight + cfg.inc;
      if (state.progressionOffers[exId] !== offer) {
        state.progressionOffers[exId] = offer;

    const m = ensureMeta(exId);
    m.lastSets = item.sets.filter((s) => s.done).map((s) => s.reps);
    if (!m.lastSets.length) return;
    m.lastDate = state._activeYmd || localYMD();
    if (WEIGHTED[exId]) {
      m.weight = item.sets[0].weight;
      if (!state.exerciseWeightLog[exId]) state.exerciseWeightLog[exId] = [];
      state.exerciseWeightLog[exId].push({ date: m.lastDate, weight: m.weight });

    const mon = weekdayMon0(ymd);
    d.setDate(d.getDate() - mon);
    return localYMD(d);
  }

  function weeklyEasyCardioMinutes(ymd) {
    const ws = weekStartYmd(ymd);
    let total = 0;
    for (let i = 0; i < 7; i++) {

      const day = state.days[key];
      if (day) total += day.easyCardioMin || 0;
    }
    return total;
  }

  function streakCount() {
    if (!state.startDate) return 0;
    const today = localYMD();
    let streak = 0;
    let ymd = today;
    while (true) {
      const pd = programDayFor(ymd);
      if (pd == null || pd < 1) break;
      const day = state.days[ymd];
      if (day && (day.completed || day.skipped || day.miniWorkout)) {
        streak++;
        ymd = addDays(ymd, -1);
      } else if (ymd === today) {
        ymd = addDays(ymd, -1);
      } else break;
    }
    return streak;
  }

  function beep() {
    if (!state.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      o.start();
      o.stop(audioCtx.currentTime + 0.15);
    } catch (_) {}
    try { navigator.vibrate && navigator.vibrate(120); } catch (_) {}
  }

  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator && !timerState.wakeLock) {
        timerState.wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (_) {}
  }

  function releaseWakeLock() {
    try {
      if (timerState.wakeLock) {
        timerState.wakeLock.release();
        timerState.wakeLock = null;
      }
    } catch (_) {}
  }

  function stopTimer() {
    if (timerState.intervalId) clearInterval(timerState.intervalId);
    if (timerState.countdownId) clearInterval(timerState.countdownId);
    timerState.intervalId = null;
    timerState.countdownId = null;
    timerState.running = false;
    timerState.phase = "idle";
    releaseWakeLock();
    render();
  }

  function startCountdownThenRun(fn) {
    const savedPhase = timerState.phase;
    const savedRemaining = timerState.remaining;
    let c = 3;
    timerState.phase = "countdown";
    timerState.remaining = c;
    render();
    beep();
    timerState.countdownId = setInterval(() => {
      c--;
      timerState.remaining = c;
      if (c <= 0) {
        clearInterval(timerState.countdownId);
        timerState.countdownId = null;
        timerState.phase = savedPhase;
        timerState.remaining = savedRemaining;
        fn();
      } else beep();
      render();
    }, 1000);
  }

  function timerTick() {
    timerState.remaining--;
    if (timerState.remaining <= 0) {
      beep();
      if (timerState.mode === "sprint") {
        if (timerState.phase === "work") {
          timerState.phase = "rest";
          timerState.remaining = timerState.restSec;
        } else {
          if (timerState.round >= timerState.totalRounds) {
            stopTimer();
            return;
          }
          timerState.round++;
          timerState.phase = "work";
          timerState.remaining = timerState.workSec;
        }
      } else if (timerState.mode === "hiit") {
        if (timerState.phase === "work") {
          timerState.phase = "rest";
          timerState.remaining = timerState.restSec;
        } else {
          if (timerState.round >= timerState.totalRounds) {
            stopTimer();
            return;
          }
          timerState.round++;
          timerState.phase = "work";
          timerState.remaining = timerState.workSec;
        }
      } else if (timerState.mode === "hold" || timerState.mode === "meditation" || timerState.mode === "rest") {
        stopTimer();
        return;
      }
    }
    render();
  }

  function runTimerInterval() {
    requestWakeLock();
    timerState.running = true;
    timerState.intervalId = setInterval(timerTick, 1000);
    render();
  }

  function loadTimerForToday() {
    const ymd = localYMD();
    const pd = programDayFor(ymd);
    if (!pd) return;
    const phase = getPhase(pd);
    const wd = weekdayMon0(ymd);
    if (wd === 1 && !phase.light) {
      timerState.mode = "sprint";
      timerState.workSec = 20;
      timerState.restSec = phase.sprintRest;
      timerState.totalRounds = phase.sprintRounds;
    } else if (wd === 3 && !phase.light) {
      timerState.mode = "hiit";
      timerState.workSec = phase.hiitHard;
      timerState.restSec = phase.hiitEasy;
      timerState.totalRounds = phase.hiitRounds;
    }
  }

      esc(ci.waist || "") +
      '" />' +
      '<label>Max push-ups</label><input type="text" data-action="checkin" data-key="' +
      key +
      '" data-field="pushups" value="' +
      esc(ci.pushups || "") +
      '" />' +
      '<label>Plank hold (sec)</label><input type="text" data-action="checkin" data-key="' +
      key +
      '" data-field="plank" value="' +
      esc(ci.plank || "") +
      '" />' +
      '<label>Goblet squat weight</label><input type="text" data-action="checkin" data-key="' +
      key +
      '" data-field="goblet" value="' +
      esc(ci.goblet || "") +
      '" />' +
      '<label>Photo note (URL or description)</label><input type="text" data-action="checkin" data-key="' +
      key +
      '" data-field="photo" value="' +
      esc(ci.photo || "") +
      '" />' +
      "</div>"
    );
  }

  function renderToday() {
    if (!state.startDate) {
      return (
        '<div class="start-hero">' +
        '<div class="start-blob" aria-hidden="true"></div>' +
        "<h1>Let’s go — 60 days</h1>" +
        "<p>Strength, cardio, and recovery that gets a little better each week. Day 1 is <strong>tomorrow (Oct 5)</strong>. You’ve got this.</p>" +
        '<button type="button" class="btn btn-primary btn-huge" data-action="start-program">Start my 60 days</button>' +
        "</div>"
      );
    }
    const ymd = state.viewDay || localYMD();
    const pd = programDayFor(ymd);
    if (!pd) {
      return '<p class="muted">This date is outside your 60-day window.</p>';
    }
    const phase = getPhase(pd);
    const dayRec = ensureDay(ymd);
    let html = renderProgressionBanners();
    html += renderMissedBanner();
    html += '<div class="phase-chip">' + phase.name + " phase</div>";
    html += '<h1>Day ' + pd + " of 60</h1>";
    if (pd === 60) {
      html += '<div class="banner"><strong>Retest day</strong> — repeat your check-in moves and compare to Day 1.</div>';
    }
    html += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + Math.min(100, (pd / 60) * 100) + '%"></div></div>';
    if (state.viewDay && state.viewDay !== localYMD()) {
      html += '<p class="muted">Viewing ' + ymd + ' <button type="button" class="btn btn-sm" data-action="view-today">Back to today</button></p>';
    }
    html += renderFuelReminders();
    html += '<div class="card">' + renderTodayWorkout(ymd, pd, phase) + "</div>";
    html += '<div class="card">' + renderHabits(ymd) + "</div>";
    html += renderCheckIn(ymd, pd);

    if (!dayRec.completed && !dayRec.skipped) {
      html +=
        '<button type="button" class="btn btn-primary" data-action="finish-workout" data-day="' +
        ymd +
        '">Finish workout</button>' +
        '<p class="hint" style="margin-top:16px">No time today?</p>' +
        '<button type="button" class="btn btn-ghost" data-action="mini-workout" data-day="' +
        ymd +
        '">11-min backup workout</button>' +
        '<div class="hint">2 min warm-up, 8×20s hard / 20s rest, 4 min walk + stretch. Counts as done.</div>';
    } else if (dayRec.completed && !dayRec.celebrationShown) {
      dayRec.celebrationShown = true;
      save();
      html +=
        '<div class="celebrate card"><div class="confetti" aria-hidden="true"></div><h2>You did it!</h2><p>Day ' +
        pd +
        " is in the books. Be proud — recovery counts too.</p></div>";
    } else if (dayRec.miniWorkout) {
      html += '<p class="muted">Today: 11-min backup completed.</p>';
    } else if (dayRec.skipped) {
      html += '<p class="muted">This day was skipped — program continues. <button type="button" class="btn btn-sm btn-ghost" data-action="undo-skip" data-day="' + ymd + '">Undo skip</button></p>';
    }
    return html;
  }

  function renderTimerTab() {
    loadTimerForToday();
    const ts = timerState;
    let modeLabel = "Timer";
    if (ts.mode === "sprint") modeLabel = "Sprint " + ts.workSec + "s / " + ts.restSec + "s rest";
    if (ts.mode === "hiit") modeLabel = "Hard cardio 4 min / easy 3 min";
    if (ts.mode === "hold") modeLabel = "Hold timer";
    if (ts.mode === "meditation") modeLabel = "Meditation";
    if (ts.mode === "rest") modeLabel = "Rest";

    let html = '<h1>Timer</h1><p class="muted">' + esc(modeLabel) + "</p>";
    html += '<div class="timer-panel">';
    if (ts.phase === "countdown") {
      html += '<div class="timer-display">' + ts.remaining + "</div><p>Get ready…</p>";
    } else if (ts.running || ts.phase !== "idle") {
      const cls = ts.phase === "work" || ts.mode === "hold" ? "work" : "rest";
      html +=
        '<div class="timer-display ' +
        cls +
        '">' +
        formatTime(ts.remaining) +
        "</div>" +
        '<div class="timer-round">Round ' +
        ts.round +
        " / " +
        ts.totalRounds +
        "</div>";
      html += '<button type="button" class="btn btn-ghost" data-action="timer-stop">Stop</button>';
    } else {
      html += '<div class="timer-display">—</div>';
      html += '<button type="button" class="btn btn-primary btn-huge" data-action="timer-start-main">Start</button>';
    }
    html += "</div>";
    html += '<h2>More timers</h2>';
    html += '<button type="button" class="btn" data-action="timer-hold" data-sec="20">Plank hold</button> ';
    html += '<button type="button" class="btn" data-action="timer-rest" data-sec="60">Rest 60s</button> ';
    html += '<button type="button" class="btn" data-action="timer-rest" data-sec="90">Rest 90s</button> ';
    html += '<button type="button" class="btn" data-action="timer-meditation">Meditation 15 min</button>';
    return html;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function simpleLineChart(points, color) {
    if (!points.length) return '<p class="muted">No data yet.</p>';
    const w = 300;
    const h = 100;
    const xs = points.map((p, i) => i);
    const ys = points.map((p) => p.v);
    const minY = Math.min.apply(null, ys);
    const maxY = Math.max.apply(null, ys);
    const range = maxY - minY || 1;
    const coords = points.map((p, i) => {
      const x = (i / Math.max(1, points.length - 1)) * (w - 10) + 5;
      const y = h - 5 - ((p.v - minY) / range) * (h - 10);
      return x + "," + y;
    });
    return (
      '<svg class="chart-svg" viewBox="0 0 ' +
      w +
      " " +
      h +
      '" preserveAspectRatio="none"><polyline fill="none" stroke="' +
      color +
      '" stroke-width="2" points="' +
      coords.join(" ") +
      '"/></svg>'
    );
  }

  function renderProgress() {
    const today = localYMD();
    const pdToday = programDayFor(today) || 0;
    let grid = '<div class="grid-60">';
    for (let i = 1; i <= 60; i++) {
      const d = dateForProgramDay(i);
      const rec = state.days[d];
      let cls = "";
      if (i === pdToday) cls = "today";
      else if (rec && (rec.completed || rec.miniWorkout)) cls = "done";
      else if (rec && rec.skipped) cls = "done";
      else if (daysDiff(d, today) < 0 && state.startDate) cls = "missed";
      grid += '<div class="grid-cell ' + cls + '" title="Day ' + i + '">' + i + "</div>";
    }
    grid += "</div>";

    const phase = getPhase(pdToday || 1);
    const cardio = weeklyEasyCardioMinutes(today);
    const bw = (state.bodyWeightLog || []).slice(-20);
    const bwPoints = bw.map((p) => ({ v: parseFloat(p.value) || 0 }));

    let html =
      "<h1>Progress</h1>" +
      "<p>Streak: <strong>" +
      streakCount() +
      "</strong> days</p>" +
      grid +
      '<div class="card"><h2>Easy cardio this week</h2><p>' +
      cardio +
      " / " +
      phase.weeklyCardio +
      " min target</p></div>" +
      '<div class="card"><h2>Body weight</h2>' +
      simpleLineChart(bwPoints, "#3dd68c") +
      "</div>";

    ["goblet_squat", "ohp", "db_row"].forEach((ex) => {
      const log = (state.exerciseWeightLog[ex] || []).slice(-15);
      html +=
        '<div class="card"><h2>' +
        ex.replace("_", " ") +
        " weight</h2>" +
        simpleLineChart(
          log.map((p) => ({ v: displayWeight(p.weight) })),
          "#3d8fd9"
        ) +
        "</div>";
    });

    html += "<h2>Check-ins</h2>";
    CHECKIN_DAYS.forEach((d) => {
      const ci = state.checkIns[String(d)] || {};
      html +=
        '<div class="card" style="display:inline-block;width:48%;vertical-align:top;margin:1%"><strong>Day ' +
        d +
        "</strong><br/><span class='muted'>" +
        esc(ci.weight || "—") +
        " wt · " +
        esc(ci.pushups || "—") +
        " push-ups</span></div>";
    });
    return html;
  }

  function renderMore() {
    const rules = [
      "Show up — a short session beats a zero.",
      "Missing a day does not reset your 60 days.",
      "Form first — drop weight or level if reps break down.",
      "Sleep 7–8 hours; that's when you adapt.",
      "Protein at each meal supports recovery.",
      "Hydrate through the day, especially before cardio.",
      "Sharp pain means stop; soreness is normal.",
    ];
    let rulesHtml = "<ol class='rules-list'>";
    rules.forEach((r) => (rulesHtml += "<li>" + esc(r) + "</li>"));
    rulesHtml += "</ol>";

    let phasesHtml = "";
    [1, 15, 29, 43, 57].forEach((start) => {
      const ph = getPhase(start);
      phasesHtml += "<p><strong>" + ph.name + "</strong> (days " + start + "+): " + ph.sets + " sets, " + ph.repMin + "–" + ph.repMax + " reps; sprints " + ph.sprintRounds + "×; 4×4 " + ph.hiitRounds + " rounds; ~" + ph.weeklyCardio + " min easy cardio/week.</p>";
    });

    return (
      "<h1>More</h1>" +
      '<div class="card"><h2>7 rules</h2>' +
      rulesHtml +
      "</div>" +
      '<div class="card"><h2>Fuel</h2>' +
      "<p>Pre: light carbs + protein 1–2 h before training.</p>" +
      "<p>Post: protein + carbs within about 60 minutes.</p>" +
      "<p>Daily: palm-sized protein each meal, 8–10k steps, steady water.</p></div>" +
      '<div class="card"><h2>Full plan</h2>' +
      "<p><strong>Mon:</strong> Strength A + easy cardio (~60 min)</p>" +
      "<p><strong>Tue:</strong> Sprints + easy cardio</p>" +
      "<p><strong>Wed:</strong> Strength picks + yoga + stretch</p>" +
      "<p><strong>Thu:</strong> Norwegian 4×4</p>" +
      "<p><strong>Fri:</strong> Strength B</p>" +
      "<p><strong>Sat:</strong> Play + note</p>" +
      "<p><strong>Sun:</strong> Active recovery + meditation</p>" +
      phasesHtml +
      "</div>" +
      '<div class="card"><h2>Settings</h2>' +
      '<label>Start date</label><input type="date" id="set-start" value="' +
      esc(state.startDate || "") +
      '" />' +
      '<label>Units</label><select id="set-unit"><option value="lb"' +
      (state.unit === "lb" ? " selected" : "") +
      '>Pounds (lb)</option><option value="kg"' +
      (state.unit === "kg" ? " selected" : "") +
      ">Kilograms (kg)</option></select>" +
      '<label><input type="checkbox" id="set-sound"' +
      (state.sound ? " checked" : "") +
      " /> Timer sounds</label>" +
      '<button type="button" class="btn" data-action="export-json">Export backup</button> ' +
      '<button type="button" class="btn" data-action="import-json">Import backup</button> ' +
      '<button type="button" class="btn btn-ghost" data-action="reset-all" style="margin-top:12px;color:var(--danger)">Reset all data</button>' +
      "</div>"
    );
  }

  function renderTabs() {
    const tabs = [
      { id: "today", label: "Today" },
      { id: "timer", label: "Timer" },
      { id: "progress", label: "Progress" },
      { id: "more", label: "More" },
    ];
    const bar = document.getElementById("tab-bar");
    if (!state.startDate) {
      bar.innerHTML = "";
      bar.classList.add("hidden");
      return;
    }
    bar.classList.remove("hidden");
    bar.innerHTML = tabs
      .map(
        (t) =>
          '<button type="button" data-action="tab" data-tab="' +
          t.id +
          '"' +
          (state.tab === t.id ? ' class="active"' : "") +
          ">" +
          t.label +
          "</button>"
      )
      .join("");
  }

  function render() {
    const app = document.getElementById("app");
    renderTabs();
    if (!state.startDate) {
      app.innerHTML = renderToday();
      return;
    }
    let content = "";
    if (state.tab === "today") content = renderToday();
    else if (state.tab === "timer") content = renderTimerTab();
    else if (state.tab === "progress") content = renderProgress();
    else if (state.tab === "more") content = renderMore();
    app.innerHTML = content;
  }

  function finishWorkout(ymd) {
    const day = ensureDay(ymd);
    day.completed = true;
    day.celebrationShown = false;
    Object.keys(day.items).forEach((id) => {
      const item = day.items[id];
      if (!item.sets || !item.sets.length) return;
      const exId = id.startsWith("wed_") ? id.slice(4) : id;
      if (WEIGHTED[exId] || exId === "pushups") commitExerciseLog(exId, item);
    });
    save();
    render();
  }

  document.getElementById("tab-bar").addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    if (t.dataset.action === "tab") {
      state.tab = t.dataset.tab;
      save();
      render();
    }
  });

  document.getElementById("app").addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const action = t.dataset.action;
    const day = t.dataset.day || localYMD();

    if (action === "start-program") {
      state.startDate = "2026-10-05";
      state.tab = "today";
      state.viewDay = null;
      Object.keys(WEIGHTED).forEach((k) => ensureMeta(k));
      ensureMeta("pushups");
      save();
      render();
      return;
    }
    if (action === "tab") {
      state.tab = t.dataset.tab;
      save();
      render();
      return;
    }
    if (action === "item-check") {
      const item = getItem(t.dataset.day, t.dataset.id);
      item.checked = !item.checked;
      save();
      render();
      return;
    }
    if (action === "set-toggle") {
      const item = getItem(state.viewDay || localYMD(), t.dataset.ex);
      const idx = +t.dataset.idx;
      item.sets[idx].done = !item.sets[idx].done;
      save();
      render();
      return;
    }
    if (action === "set-weight") {
      const item = getItem(state.viewDay || localYMD(), t.dataset.ex);
      const idx = +t.dataset.idx;
      const delta = +t.dataset.delta;
      item.sets[idx].weight = Math.max(0, item.sets[idx].weight + delta);
      const metaEx = t.dataset.meta || t.dataset.ex.replace(/^wed_/, "");
      ensureMeta(metaEx).weight = item.sets[idx].weight;
      save();
      render();
      return;
    }
    if (action === "set-reps") {
      const item = getItem(state.viewDay || localYMD(), t.dataset.ex);
      const idx = +t.dataset.idx;
      item.sets[idx].reps = Math.max(0, item.sets[idx].reps + (+t.dataset.delta));
      save();
      render();
      return;
    }
    if (action === "habit") {
      const d = ensureDay(t.dataset.day);
      d.habits[t.dataset.key] = !d.habits[t.dataset.key];
      save();
      render();
      return;
    }
    if (action === "cardio-min") {
      const item = getItem(t.dataset.day, t.dataset.id);
      const d = ensureDay(t.dataset.day);
      const delta = +t.dataset.delta;
      item.minutes = Math.max(0, (item.minutes || 0) + delta);
      d.easyCardioMin = Math.max(0, (d.easyCardioMin || 0) + delta);
      save();
      render();
      return;
    }
    if (action === "finish-workout") {
      finishWorkout(t.dataset.day);
      return;
    }
    if (action === "mini-workout") {
      const d = ensureDay(t.dataset.day);
      d.miniWorkout = true;
      d.completed = true;
      save();
      render();
      return;
    }
    if (action === "skip-day") {
      const d = ensureDay(t.dataset.day);
      d.skipped = true;
      save();
      render();
      return;
    }
    if (action === "undo-skip") {
      const d = ensureDay(t.dataset.day);
      d.skipped = false;
      save();
      render();
      return;
    }
    if (action === "catchup") {
      state.viewDay = t.dataset.day;
      state.tab = "today";
      save();
      render();
      return;
    }
    if (action === "view-today") {
      state.viewDay = null;
      save();
      render();
      return;
    }
    if (action === "prog-accept") {
      const ex = t.dataset.ex;
      const w = state.progressionOffers[ex];
      ensureMeta(ex).weight = w;
      delete state.progressionOffers[ex];
      save();
      render();
      return;
    }
    if (action === "prog-decline") {
      delete state.progressionOffers[t.dataset.ex];
      save();
      render();
      return;
    }
    if (action === "push-level") {
      const item = getItem(t.dataset.day, "pushups");
      item.level = +t.dataset.lvl;
      ensureMeta("pushups").pushLevel = item.level;
      save();
      render();
      return;
    }
    if (action === "wed-toggle") {
      const d = ensureDay(t.dataset.day);
      const id = t.dataset.id;
      if (d.wedPicks.includes(id)) d.wedPicks = d.wedPicks.filter((x) => x !== id);
      else if (d.wedPicks.length < 5) d.wedPicks.push(id);
      save();
      render();
      return;
    }
    if (action === "timer-start-main") {
      if (timerState.mode === "meditation") {
        timerState.round = 1;
        timerState.totalRounds = 1;
        timerState.phase = "rest";
        startCountdownThenRun(runTimerInterval);
        return;
      }
      loadTimerForToday();
      if (!timerState.mode) timerState.mode = "sprint";
      timerState.round = 1;
      timerState.phase = "work";
      timerState.remaining = timerState.workSec || 20;
      startCountdownThenRun(runTimerInterval);
      return;
    }
    if (action === "timer-stop") {
      stopTimer();
      return;
    }
    if (action === "timer-sprint") {
      state.tab = "timer";
      const pd = programDayFor(localYMD()) || 1;
      const phase = getPhase(pd);
      timerState.mode = "sprint";
      timerState.workSec = 20;
      timerState.restSec = phase.sprintRest;
      timerState.totalRounds = phase.sprintRounds;
      save();
      render();
      return;
    }
    if (action === "timer-hiit") {
      state.tab = "timer";
      const pd = programDayFor(localYMD()) || 1;
      const phase = getPhase(pd);
      timerState.mode = "hiit";
      timerState.workSec = phase.hiitHard;
      timerState.restSec = phase.hiitEasy;
      timerState.totalRounds = phase.hiitRounds;
      save();
      render();
      return;
    }
    if (action === "timer-hold") {
      state.tab = "timer";
      timerState.mode = "hold";
      timerState.totalRounds = 1;
      timerState.round = 1;
      timerState.phase = "work";
      timerState.remaining = +t.dataset.sec || 20;
      startCountdownThenRun(runTimerInterval);
      return;
    }
    if (action === "timer-rest") {
      state.tab = "timer";
      timerState.mode = "rest";
      timerState.totalRounds = 1;
      timerState.round = 1;
      timerState.phase = "rest";
      timerState.remaining = +t.dataset.sec;
      runTimerInterval();
      render();
      return;
    }
    if (action === "timer-meditation") {
      state.tab = "timer";
      timerState.mode = "meditation";
      timerState.totalRounds = 1;
      timerState.round = 1;
      timerState.phase = "rest";
      timerState.remaining = 15 * 60;
      save();
      render();
      return;
    }
    if (action === "export-json") {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "what100-workout-backup.json";
      a.click();
      return;
    }
    if (action === "import-json") {
      document.getElementById("import-file").click();
      return;
    }
    if (action === "reset-all") {
      if (confirm("Delete all workout data? This cannot be undone.")) {
        state = defaultState();
        save();
        render();
      }
      return;
    }
  });

  document.body.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "set-start" && t.value) {
      state.startDate = t.value;
      save();
      render();
    }
    if (t.id === "set-unit") {
      state.unit = t.value;
      save();
      render();
    }
    if (t.id === "set-sound") {
      state.sound = t.checked;
      save();
    }
  });

  document.getElementById("import-file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        state = { ...defaultState(), ...JSON.parse(fr.result) };
        save();
        render();
      } catch {
        alert("Invalid backup file.");
      }
    };
    fr.readAsText(f);
    e.target.value = "";
  });

  document.getElementById("app").addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.action === "checkin") {
      const key = t.dataset.key;
      if (!state.checkIns[key]) state.checkIns[key] = {};
      state.checkIns[key][t.dataset.field] = t.value;
      if (t.dataset.field === "weight" && t.value) {
        state.bodyWeightLog.push({ date: localYMD(), value: t.value });
      }
      save();
    }
    if (t.dataset.action === "play-note") {
      ensureDay(t.dataset.day).playNote = t.value;
      save();
    }
  });

  if ("serviceWorker" in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker
      .register("./sw.js?v=7")
      .then(function (reg) {
        reg.update();
      })
      .catch(function () {});
  }

  render();
})();
  </script>
</body>
</html>
